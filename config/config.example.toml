# Example configuration for testrail-stability-analyzer.
#
# Copy to config/local/config.toml (git-ignored) and adjust for your instance.
# Credentials are never stored here: set TESTRAIL_USERNAME and TESTRAIL_API_KEY
# in your environment instead. Non-secret settings can also be overridden with
# TESTRAIL_* environment variables (see README.md).

[testrail]
base_url = "https://example.testrail.io"
project_id = 1
# Required only for projects that use multiple test suites.
# suite_id = 1

[history]
window_days = 60
max_runs = 10
# Extended lookback (days) for the latest known result, which may be older
# than the history window. 0 means no limit (scans the whole project history).
lookback_limit_days = 365

[analysis]
# Conclusive executions (passed, failed, automation issue) needed for medium
# confidence and for a "stable" diagnosis. Must be <= history.max_runs; when
# unset, 5 (or history.max_runs, if smaller).
min_executions = 5

[http]
connect_timeout_seconds = 10.0
read_timeout_seconds = 30.0
max_requests_per_execution = 1000
# Bounded retries for HTTP 429/502/503/504 and network failures. Retry-After is
# honoured; otherwise the delay doubles from retry_backoff_seconds, capped at
# max_retry_delay_seconds. Every attempt counts against max_requests_per_execution.
max_retries = 3
retry_backoff_seconds = 1.0
max_retry_delay_seconds = 60.0

[naming]
# Optional regular expressions; empty lists include all plans/runs.
plan_name_patterns = []
run_name_patterns = []

# Optional application/platform mappings. Patterns are regular expressions
# matched against the listed sources: plan_name, run_name, configuration.
[[mappings.applications]]
name = "Application A"
patterns = ['(?i)\bapp-a\b']
sources = ["plan_name", "run_name"]
# Raw values of the applicability case field (option IDs or strings) that mark
# a case as applicable to this application; requires
# mappings.custom_fields.applicability. List a "both" option under every
# application it covers.
# applicability_values = [1, 3]

[[mappings.platforms]]
name = "Platform X"
patterns = ['(?i)\bplatform-x\b']
sources = ["configuration", "run_name"]

# Optional execution types (e.g. automated vs. manual runs), matched like the above.
# [[mappings.execution_types]]
# name = "Automated"
# patterns = ['(?i)\bautomated\b']

# Logical field name -> TestRail field system name. Recognized logical names:
#   application_version  result field holding the tested version (default: "version")
#   applicability        case field listing the applications a case applies to;
#                        set applicability_values on each application to use it
#   class_name           case field holding the automated test's class name
#                        (adds a Class Name column to XLSX and XML reports)
[mappings.custom_fields]
# application_version = "version"
# applicability = "custom_target_applications"
# class_name = "custom_class_name"

# Analyzer category -> TestRail status system names or numeric IDs.
# Categories: passed, failed, blocked, not_run, retest, not_applicable,
# automation_issue. Custom statuses are optional.
[mappings.statuses]
# automation_issue = ["automation_issue"]

# Optional targeted collection. With plan or run IDs, only those plans (with
# their child runs) and runs are collected; no project-wide discovery is made.
# max_results caps the result records retrieved per execution (0 = no cap).
[collection]
plan_ids = []
run_ids = []
max_results = 0

# Credential source: "environment" (TESTRAIL_USERNAME / TESTRAIL_API_KEY) or
# "keychain" (macOS only). Only names are configured here, never secret values.
[credential_provider]
type = "environment"
# keychain_service = "example-service"
# keychain_account = "user@example.com"   # also used as the TestRail username
# username_variable = "TESTRAIL_USERNAME" # optional: read the username from this variable instead

# Optional include filters by mapped name. Runs resolved to other names are
# excluded; runs that cannot be classified are reported but not collected.
[filters]
applications = []
platforms = []
execution_types = []

# Feature / Test Group in reports, reconstructed from each case's TestRail
# section hierarchy (e.g. "Top Section/Child Section"). Section metadata is
# fetched only when a report is generated (--xlsx-report and/or --xml-report),
# once per suite and shared by both formats.
[report.feature_group]
enabled = true
separator = "/"
# Section levels shown from the top; 0 shows the full hierarchy.
max_depth = 0
# Prefix labels with the suite name (one extra get_suites request).
include_suite_name = false

# Blocked Reason: for a latest verified Blocked result, a sanitized excerpt of
# the comment section that follows one of these headers (start of a line,
# case-insensitive). Without such a section, "Reason unavailable" is shown;
# the comment itself is never exported.
[report.blocked_reason]
enabled = true
section_headers = ["BLOCKED REASON", "SKIPPED REASON"]
max_length = 160

# Test Case Applicability column (shown when mappings.custom_fields.applicability
# is set). Labels are the configured application names; all_label replaces them
# when every configured application matches.
[report.applicability]
# all_label = "Both"
